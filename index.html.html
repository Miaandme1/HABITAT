<style>
:root{--bg:#eef2ea;--card:#fbfcf8;--ink:#1f2a22;--mute:#5d6b60;--line:#d3dccd;--acc:#2f6b4f;--acc2:#b8893f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c18;--card:#1e2721;--ink:#e6ede6;--mute:#9bab9f;--line:#32403a;--acc:#6fbf94;--acc2:#d9ad63;--on:#10201a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161c18;--card:#1e2721;--ink:#e6ede6;--mute:#9bab9f;--line:#32403a;--acc:#6fbf94;--acc2:#d9ad63;--on:#10201a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h1{font-size:1.6rem}.brand{display:flex;align-items:center;gap:12px}.brand img{border-radius:12px;display:block}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:100px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
section>h2{font-size:1.2rem;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row>label,.row>span.l{flex:1 1 180px}
.sub{color:var(--mute);font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn.add{border-style:dashed;margin-top:8px}
.btn.x{padding:4px 10px;color:var(--mute)}
input[type=range]{accent-color:var(--acc);width:150px}
input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0}
.big{font-family:Georgia,serif;font-size:3rem;line-height:1;color:var(--acc)}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;display:flex;margin:10px 0}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem}
.leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.scale{position:relative;height:10px;background:linear-gradient(90deg,var(--acc),var(--acc2),#b5503c);border-radius:5px;margin:14px 0 4px}
.scale i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px}
.sum li{margin:3px 0}.tabs button{padding:12px 4px;font-size:.95rem}
.woods{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wd{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.wd.on{border-color:var(--acc)}.wd svg{width:100%;height:auto}.wd .sub{font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;background:var(--card);font-size:.9rem}
.tip{background:var(--bg);border-left:3px solid var(--acc);padding:8px 10px;border-radius:6px;margin:6px 0}
</style>
</head>

else{const[i,j]=d.key.split(":").map(Number),r=h.rooms.find(q=>q.id===i),it=r.items.find(q=>q.id===j),dm=FD[it.k],bw=it.r?dm[1]:dm[0],bh=it.r?dm[0]:dm[1];it.x=Math.min(Math.max(0,Math.round((it.x+d.dx/m)*4)/4),Math.max(0,r.w-bw));it.y=Math.min(Math.max(0,Math.round((it.y+d.dy/m)*4)/4),Math.max(0,r.d-bh));}
